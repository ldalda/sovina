# Radar de Pródigos: caça posts sobre "gastar demais" 2x/dia e manda os
# rascunhos de reply pro WhatsApp do admin aprovar.
# Horários: 10h e 19h de Brasília (13h e 22h UTC).

name: Threads hunt

on:
  schedule:
    - cron: "7 13,22 * * *"
  workflow_dispatch: {}

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Caça e rascunha replies
        run: |
          curl -sS --fail-with-body -X POST \
            "$APP_URL/api/threads/hunt" \
            -H "Authorization: Bearer $CRON_SECRET"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
